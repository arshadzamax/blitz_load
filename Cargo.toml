[package]
name = "blitz_load"
version = "0.1.0"
edition = "2021"

[lib]
name = "blitz_load"
path = "src/lib.rs"

[[bin]]
name = "blitz"
path = "src/main.rs"

[[bin]]
name = "blitz-server"
path = "src/bin/server.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Futures utilities
futures = "0.3"

# Web server
axum = { version = "0.7", features = ["macros"] }

# Thread-safe HashMap for test state
dashmap = "5"

# HTTP middleware: CORS + static file serving
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Stream utilities for SSE (BroadcastStream)
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI-only deps (used by src/main.rs)
indicatif = "0.17"
clap = { version = "4.0", features = ["derive"] }

