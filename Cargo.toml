[package]
name = "main"
version = "0.1.0"
edition = "2021"


[dependencies]
# Async runtime with all features (macros, time, etc.)
tokio = { version = "1", features = ["full"] }

# HTTP client with rustls (cleaner than openssl for beginners)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# For the progress bar
indicatif = "0.17"

futures = "0.3"
clap = { version = "4.0", features = ["derive"] }

pyo3 = { version = "0.23", features = ["auto-initialize"] }
serde_json = "1.0"


